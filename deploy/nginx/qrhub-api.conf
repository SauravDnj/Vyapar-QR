# Reverse proxy for the QRHub API running under PM2 on this VPS.
# Copy to /etc/nginx/sites-available/qrhub-api.conf, symlink into
# sites-enabled, then run `certbot --nginx -d api.yourdomain.com` to fill in
# the SSL block below (certbot rewrites this file in place).
#
# Replace api.yourdomain.com with the real API domain everywhere below.

server {
    listen 80;
    server_name api.yourdomain.com;

    # Uploaded files (logos, payment QR images, generated QR codes) can be
    # a few MB; match apps/api's own multer limit.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
