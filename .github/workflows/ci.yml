name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: "mysql://root:qrhub_dev_pw@localhost:3306/qrhub_dev"
  REDIS_URL: "redis://localhost:6379"
  JWT_ACCESS_SECRET: "ci-access-secret"
  JWT_REFRESH_SECRET: "ci-refresh-secret"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qrhub_dev_pw
          MYSQL_DATABASE: qrhub_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pqrhub_dev_pw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
